[project]
name = "a2a-local-llama-mcp"
version = "0.1.0"
description = "A small A2A agent that uses llama.cpp and MCP directly, without LangGraph."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "a2a-sdk>=1.0.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "mcp>=1.0.0",
  "python-dotenv>=1.0.0",
  "starlette>=0.37",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
a2a-local-server = "a2a_local_llama_mcp.server:main"
a2a-local-client = "a2a_local_llama_mcp.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_local_llama_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]
